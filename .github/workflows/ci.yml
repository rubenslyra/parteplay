name: CI

# Gate de merge exigido por agent.md 2.11: nenhum PR entra sem build e teste
# verdes. A versao nao aparece aqui de proposito - ela mora em um unico lugar,
# project(PartePlay VERSION x.y.z) no CMakeLists.txt, e o passo de release a le
# de la.

on:
  # develop entra no gatilho pela mesma razao que o lint de commits: sem ele, os
  # dois commits que corrigiram o PCM do fingerprint - incluindo um bug real de
  # escala, nao so um warning - foram publicados sem nunca passar por build e
  # teste de CI. A correcao foi validada so na maquina que a fez, num disco em
  # Full Repair Needed.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Versao e dados de release lidos do CMake, que e a fonte unica da verdade.
  metadata:
    name: Ler metadados do projeto
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      juce_tag: ${{ steps.read.outputs.juce_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        # python3 em vez de `grep -oP`: o resultado nao muda entre imagem do
        # runner, e o mesmo codigo serve as tres plataformas.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          text = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")

          project = re.search(r"project\(PartePlay\s+VERSION\s+([0-9.]+)", text)
          juce    = re.search(r'PARTEPLAY_JUCE_VERSION\s+"([0-9.]+)"', text)

          if not project:
              sys.exit("::error::nao foi possivel ler project(PartePlay VERSION ...) em CMakeLists.txt")
          if not juce:
              sys.exit("::error::nao foi possivel ler PARTEPLAY_JUCE_VERSION em CMakeLists.txt")

          version, juce_tag = project.group(1), juce.group(1)
          print(f"Versao do projeto: {version}")
          print(f"Versao da JUCE:    {juce_tag}")
          pathlib.Path("version.env").write_text(f"VERSION={version}\nJUCE_TAG={juce_tag}\n")
          PY
          cat version.env >> "$GITHUB_OUTPUT"

  # Falhar cedo e barato: e o unico trabalho que nao depende de JUCE nem de
  # toolchain nativa. Se o regex da versao quebrar, os tres jobs caros nao rodam.
  version-single-source:
    name: Versao em um unico lugar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhuma versao hardcoded fora do CMake
        run: |
          # agent.md 2.x proibe hardcode de versao em texto. As duas unicas
          # fontes legitimas sao os arquivos do proprio CMakeLists.
          bad=$(grep -rInE "\b[0-9]+\.[0-9]+\.[0-9]+\b" \
                 --include='*.cpp' --include='*.h' \
                 Source/ Tests/ || true)
          if [ -n "$bad" ]; then
            echo "::error::versao hardcoded no codigo:"
            echo "$bad"
            exit 1
          fi
          echo "Nenhuma versao hardcoded em Source/ ou Tests/"

  build:
    name: ${{ matrix.name }}
    needs: [ metadata, version-single-source ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: msvc
            build_type: Release
          - name: Ubuntu
            os: ubuntu-24.04
            preset: linux
            build_type: Release
          - name: macOS
            os: macos-14
            preset: macos
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Cache da JUCE (checkout grande e imutavel por tag)
        uses: actions/cache@v4
        with:
          path: .juce-deps/JUCE
          key: juce-${{ runner.os }}-${{ needs.metadata.outputs.juce_tag }}

      - name: Obter JUCE
        # shell: bash explicito. Sem isto o runner do Windows executa o passo em
        # PowerShell, onde a continuacao de linha com "\" vira argumento e o clone
        # falha com "repository '\' does not exist".
        shell: bash
        run: |
          # Idempotente: o cache acima pode ter restaurado o checkout, e um
          # "git clone" em diretorio nao vazio aborta com exit 128.
          if [ -f .juce-deps/JUCE/CMakeLists.txt ]; then
            echo "JUCE restaurado do cache"
          else
            git clone --depth 1 --branch "${{ needs.metadata.outputs.juce_tag }}" \
              https://github.com/juce-framework/JUCE.git .juce-deps/JUCE
          fi
          # No Windows o runner, $PWD e um path POSIX (/d/a/...) e o $GITHUB_ENV
          # vem com barras invertidas: redirecionar para ele direto em bash cria
          # um arquivo de nome corrompido e a variavel nunca chega ao CMake.
          # cygpath converte os dois lados.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "JUCE_ROOT=$(cygpath -m "$PWD/.juce-deps/JUCE")" >> "$(cygpath -u "$GITHUB_ENV")"
          else
            echo "JUCE_ROOT=$PWD/.juce-deps/JUCE" >> "$GITHUB_ENV"
          fi

      # Linux e macOS nao tem o toolchain de audio do JUCE instalado por
      # padrao. Sem ALSA o configure do juce_audio_utils falha.
      - name: Dependencias de audio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
                                 libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev \
                                 libxcomposite-dev libxext-dev libxfixes-dev libxi-dev \
                                 libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev
          # O juceaide e compilado por um CMake recursivo (extras/Build/juceaide)
          # que roda durante o configure do projeto principal. Esse projeto
          # interno nao herda os include dirs que o CMake calcula para os alvos do
          # projeto, entao o pkg-config do juce_graphics nao chega ate ele e
          # juce_graphics_Harfbuzz.cpp morre em "ft2build.h not found". O
          # bootstrap herda o ambiente, e o compilador le CPLUS_INCLUDE_PATH.
          freetype_cflags=$(pkg-config --cflags freetype2 2>/dev/null || true)
          if [ -n "$freetype_cflags" ]; then
            incs=$(echo "$freetype_cflags" | tr ' ' '\n' | sed -n 's/^-I//p' | paste -sd: -)
            echo "CPLUS_INCLUDE_PATH=$incs" >> "$GITHUB_ENV"
            echo "CPLUS_INCLUDE_PATH para o bootstrap do juceaide: $incs"
          else
            echo "::warning::pkg-config nao achou freetype2; o build do juceaide pode falhar"
          fi

      - name: Cache de build
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: build-${{ matrix.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: build-${{ matrix.os }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Testes
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

      # O .vst3 e um diretorio (bundle) em todas as plataformas, entao compactar o
      # caminho direto falha e o passo tem de packagear o CONTEUDO do bundle.
      # Compress-Archive e um cmdlet do PowerShell: nao roda em shell bash, e o
      # runner do Windows so tem bash sem esse cmdlet. Por isso um passo por SO.
      - name: Empacotar o VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Caminho exato, e nao "o primeiro PartePlay.vst3 que aparecer".
          #
          # Este passo empacotava o primeiro bundle encontrado na varredura, e o
          # cache de build restaura arvores antigas (restore-keys ignora o sha).
          # Num projeto multi-config isso escolhe Debug antes de Release, porque
          # "Debug" ordena antes de "Release" no nome do diretorio - e o job so
          # compila Release. Ou seja: o artefato publicado no Windows era um
          # build Debug de um commit anterior, com codigo diferente do que o
          # job acabou de compilar. Depende da ordem da varredura, entao o
          # resultado mudava conforme o cache.
          #
          # E a explicaçao de dois binarios com hashes diferentes saindo do
          # mesmo fonte, que foi o sintoma com que isso comecou.
          $bundle = "build/${{ matrix.preset }}/PartePlay_artefacts/${{ matrix.build_type }}/VST3/PartePlay.vst3"
          if (-not (Test-Path $bundle -PathType Container)) {
            Write-Error "::error::bundle nao encontrado em $bundle (esperado config ${{ matrix.build_type }})"
            Get-ChildItem "build/${{ matrix.preset }}" -Recurse -Directory -Filter 'PartePlay.vst3' |
              ForEach-Object { Write-Host "  encontrado: $($_.FullName)" }
            exit 1
          }
          Write-Host "Bundle: $bundle"

          # O runner do Windows cria desktop.ini dentro do bundle. Ele nunca e
          # intencional e nao pode entrar no zip, entao e removido e a ausencia
          # de qualquer resto e verificada em seguida. Falhar sem limpar
          # transformaria um detalhe do runner em CI vermelho permanente.
          $lixo = Get-ChildItem $bundle -Recurse -Force -File |
                   Where-Object { $_.Name -in @('desktop.ini','Thumbs.db','.DS_Store') }
          foreach ($f in $lixo) {
            Write-Host "  removendo: $($f.Name)"
            Remove-Item $f.FullName -Force
          }
          $resto = Get-ChildItem $bundle -Recurse -Force -File |
                   Where-Object { $_.Name -in @('desktop.ini','Thumbs.db','.DS_Store') }
          if ($resto) {
            $resto | ForEach-Object { Write-Host "  - $($_.FullName)" }
            Write-Error "::error::lixeira dentro do bundle VST3"
            exit 1
          }
          $out = "${{ matrix.name }}-PartePlay-PartePlay.vst3.zip"
          Compress-Archive -Path $bundle -DestinationPath $out -Force
          Write-Host "Artefato: $out"

      - name: Empacotar o VST3 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="build/${{ matrix.preset }}"
          bundle=$(find "$root" -type d -name 'PartePlay.vst3' | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::PartePlay.vst3 nao encontrado em $root"
            exit 1
          fi
          echo "Bundle: $bundle"
          # Mesma verificacao do passo Windows: o artefato e o zip, e nada
          # depois disso pode tirar um arquivo de dentro dele.
          lixo=$(find "$bundle" -type f \( -name 'desktop.ini' -o -name 'Thumbs.db' -o -name '.DS_Store' \) -print)
          if [ -n "$lixo" ]; then
            echo "removendo lixeira:"; echo "$lixo" | sed 's/^/  /'
            echo "$lixo" | while IFS= read -r f; do rm -f "$f"; done
          fi
          resto=$(find "$bundle" -type f \( -name 'desktop.ini' -o -name 'Thumbs.db' -o -name '.DS_Store' \))
          if [ -n "$resto" ]; then
            echo "::error::lixeira dentro do bundle VST3:"; echo "$resto"; exit 1
          fi
          out="${{ matrix.name }}-PartePlay-PartePlay.vst3.zip"
          (cd "$(dirname "$bundle")" && zip -r "$GITHUB_WORKSPACE/$out" "$(basename "$bundle")")
          echo "Artefato: $out"

      - uses: actions/upload-artifact@v4
        with:
          name: PartePlay-${{ matrix.name }}
          path: ${{ matrix.name }}-PartePlay-PartePlay.vst3.zip
          if-no-files-found: error

  # macOS universal (x86_64 + arm64) em job separado: exige as duas arquiteturas
  # no mesmo runner, o que so o macOS oferece.
  universal:
    name: macOS universal
    needs: [ metadata, version-single-source, build ]
    if: needs.build.result == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Obter JUCE
        # shell: bash explicito. Sem isto o runner do Windows executa o passo em
        # PowerShell, onde a continuacao de linha com "\" vira argumento e o clone
        # falha com "repository '\' does not exist".
        shell: bash
        run: |
          # Idempotente: o cache acima pode ter restaurado o checkout, e um
          # "git clone" em diretorio nao vazio aborta com exit 128.
          if [ -f .juce-deps/JUCE/CMakeLists.txt ]; then
            echo "JUCE restaurado do cache"
          else
            git clone --depth 1 --branch "${{ needs.metadata.outputs.juce_tag }}" \
              https://github.com/juce-framework/JUCE.git .juce-deps/JUCE
          fi
          # No Windows o runner, $PWD e um path POSIX (/d/a/...) e o $GITHUB_ENV
          # vem com barras invertidas: redirecionar para ele direto em bash cria
          # um arquivo de nome corrompido e a variavel nunca chega ao CMake.
          # cygpath converte os dois lados.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "JUCE_ROOT=$(cygpath -m "$PWD/.juce-deps/JUCE")" >> "$(cygpath -u "$GITHUB_ENV")"
          else
            echo "JUCE_ROOT=$PWD/.juce-deps/JUCE" >> "$GITHUB_ENV"
          fi

      - name: Build universal
        run: |
          cmake --preset macos-universal
          cmake --build build/macos-universal --config Release

      - name: Empacotar
        run: |
          set -euo pipefail
          bundle=$(find build/macos-universal -type d -name 'PartePlay.vst3' | head -1)
          test -n "$bundle" || { echo "::error::bundle universal nao encontrado"; exit 1; }
          # Num bundle VST3 de macOS o executavel fica em Contents/MacOS/ com o
          # nome do produto e SEM extensao: procurar por *.dylib nao acha nada.
          # A ordem importa: primeiro o caminho do bundle, depois qualquer
          # Mach-O por extensao (se um dia o layout mudar).
          bin=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            bin=$(find "$bundle" -type f \( -name '*.dylib' -o -name '*.so' \) | head -1)
          fi
          test -n "$bin" || { echo "::error::binario do bundle nao encontrado"; exit 1; }
          lipo_archs=$(lipo -archs "$bin")
          echo "arquiteturas: $lipo_archs"
          case "$lipo_archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::bundle nao e universal: $lipo_archs"; exit 1; ;;
          esac
          out="macOS-universal-PartePlay-PartePlay.vst3.zip"
          lixo=$(find "$bundle" -type f \( -name 'desktop.ini' -o -name 'Thumbs.db' -o -name '.DS_Store' \) -print)
          if [ -n "$lixo" ]; then echo "$lixo" | while IFS= read -r f; do rm -f "$f"; done; fi
          resto=$(find "$bundle" -type f \( -name 'desktop.ini' -o -name 'Thumbs.db' -o -name '.DS_Store' \))
          if [ -n "$resto" ]; then
            echo "::error::lixeira dentro do bundle VST3:"; echo "$resto"; exit 1
          fi
          (cd "$(dirname "$bundle")" && zip -r "$GITHUB_WORKSPACE/$out" "$(basename "$bundle")")

      - uses: actions/upload-artifact@v4
        with:
          name: PartePlay-macOS-universal
          path: macOS-universal-PartePlay-PartePlay.vst3.zip
          if-no-files-found: error
