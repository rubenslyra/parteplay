name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch: # permite republicar sem editar docs/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages no repositório no primeiro deploy, em vez de
          # depender de alguém clicar em Settings > Pages > GitHub Actions.
          # Falha sem efeito se o Pages já estiver habilitado.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4