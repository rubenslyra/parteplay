name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch: # permite republicar sem editar docs/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # Requisito único, feito uma vez no repositório: Settings > Pages >
        # Source = "GitHub Actions". O token do próprio workflow não tem
        # permissão para criar o site (falha "Resource not accessible by
        # integration"), então isto não pode ser automatizado daqui.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4